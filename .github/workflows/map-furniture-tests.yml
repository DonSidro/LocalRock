name: Map and furniture validation
on:
  push:
    branches: [furniture-display, check/map-furniture, map-appearance-layers, check/map-appearance]
  workflow_dispatch:
concurrency:
  group: map-validation-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
  checks: write
jobs:
  shared-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Shared tests and Android compilation
        run: |
          set -o pipefail
          ./gradlew :composeApp:testDebugUnitTest :composeApp:assembleDebug --stacktrace 2>&1 | tee build.log
      - name: Publish compiler and test results
        if: always() && github.event_name == 'push'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const log = fs.existsSync('build.log') ? fs.readFileSync('build.log', 'utf8') : 'Build did not start.';
            const tests = 'composeApp/build/test-results/testDebugUnitTest';
            let summary = '';
            if (fs.existsSync(tests)) {
              for (const f of fs.readdirSync(tests).filter(f => f.endsWith('.xml'))) {
                const xml = fs.readFileSync(`${tests}/${f}`, 'utf8');
                summary += xml.match(/<testsuite[^>]+>/)?.[0] + '\n';
                if (!xml.includes('failures="0"')) summary += xml.slice(0, 16000);
              }
            }
            await github.rest.checks.create({owner: context.repo.owner, repo: context.repo.repo,
              head_sha: context.sha, name: 'Map shared test diagnostics', status: 'completed',
              conclusion: '${{ job.status }}' === 'success' ? 'success' : 'failure',
              output: {title: 'Shared tests and Android compilation', summary: summary.slice(-50000) || 'See output.',
                text: '```text\n' + log.slice(-48000) + '\n```'}});
      - name: Publish rendered furniture previews
        if: always() && github.event_name == 'push'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const dir = 'composeApp/build/furniture-preview';
            if (fs.existsSync(dir)) for (const file of fs.readdirSync(dir).filter(f => f.endsWith('.png'))) {
              await github.rest.checks.create({owner: context.repo.owner, repo: context.repo.repo,
                head_sha: context.sha, name: 'Furniture preview ' + file, status: 'completed', conclusion: 'success',
                output: {title: 'Native Android Canvas preview', summary: 'Generated by FurnitureRenderingTest using the production renderer.',
                  text: fs.readFileSync(dir + '/' + file).toString('base64')}});
            }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: combined-shared-test-reports
          path: composeApp/build/reports/tests
  ios:
    # Kotlin/Native Release optimization exceeds a 4 GiB heap for this combined app.
    # Standard Intel runners have 14 GiB RAM; the standard arm64 runner has 7 GiB.
    runs-on: macos-26-intel
    env:
      GRADLE_OPTS: '-Dorg.gradle.jvmargs="-Xmx8g -Xss64m -Dfile.encoding=UTF-8" -Dorg.gradle.workers.max=2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/checkout@v4
        with:
          repository: emqx/CocoaMQTT
          ref: '2.4.1'
          path: local-work/dependencies/CocoaMQTT
      - name: Locate the existing local package in this CI checkout
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('iosApp/iosApp.xcodeproj/project.pbxproj')
          p.write_text(p.read_text().replace('../../CocoaMQTT-master', '../local-work/dependencies/CocoaMQTT'))
          PY
      - name: Compile shared iOS code and archive unsigned Release app
        timeout-minutes: 50
        run: |
          set -o pipefail
          ./gradlew :composeApp:compileKotlinIosArm64 :composeApp:compileKotlinIosSimulatorArm64 --stacktrace 2>&1 | tee build.log
          xcodebuild -project iosApp/iosApp.xcodeproj -scheme iosApp -configuration Release -destination 'generic/platform=iOS' -derivedDataPath local-work/DerivedData -archivePath local-work/LocalRock.xcarchive CODE_SIGNING_ALLOWED=NO archive 2>&1 | tee -a build.log
      - name: Publish iOS compiler results
        if: always() && github.event_name == 'push'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const log = fs.existsSync('build.log') ? fs.readFileSync('build.log', 'utf8') : 'Build did not start.';
            await github.rest.checks.create({owner: context.repo.owner, repo: context.repo.repo,
              head_sha: context.sha, name: 'Map iOS Release archive', status: 'completed',
              conclusion: '${{ job.status }}' === 'success' ? 'success' : 'failure',
              output: {title: 'Shared iOS and Swift app compilation', summary: 'Unsigned Release iPhone archive; device testing is separate.',
                text: '```text\n' + log.slice(-48000) + '\n```'}});

