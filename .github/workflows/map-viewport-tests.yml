name: Map viewport checks
on:
  push:
    branches: [FIX_MAP_VIEWPORT]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  checks: write
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - name: Build and test Android
        run: |
          set -o pipefail
          ./gradlew :composeApp:testDebugUnitTest :composeApp:assembleDebug --stacktrace 2>&1 | tee build.log
      - name: Publish build diagnostics
        if: always() && github.event_name == 'push'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const log = fs.existsSync('build.log') ? fs.readFileSync('build.log', 'utf8') : 'Build did not start.';
            await github.rest.checks.create({
              owner: context.repo.owner, repo: context.repo.repo, head_sha: context.sha,
              name: '${{ github.job }} build diagnostics', status: 'completed',
              conclusion: '${{ job.status }}' === 'success' ? 'success' : 'failure',
              output: { title: 'Compiler and test output', summary: 'Build diagnostics for map viewport.',
                text: '```text\n' + log.slice(-50000) + '\n```' }
            });
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-test-reports
          path: composeApp/build/reports/tests
      - uses: actions/upload-artifact@v4
        with:
          name: LocalRock-map-debug
          path: composeApp/build/outputs/apk/debug/*.apk
  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - name: Compile iOS
        run: |
          set -o pipefail
          ./gradlew :composeApp:compileKotlinIosSimulatorArm64 --stacktrace 2>&1 | tee build.log
      - name: Publish build diagnostics
        if: always() && github.event_name == 'push'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const log = fs.existsSync('build.log') ? fs.readFileSync('build.log', 'utf8') : 'Build did not start.';
            await github.rest.checks.create({
              owner: context.repo.owner, repo: context.repo.repo, head_sha: context.sha,
              name: '${{ github.job }} build diagnostics', status: 'completed',
              conclusion: '${{ job.status }}' === 'success' ? 'success' : 'failure',
              output: { title: 'Compiler and test output', summary: 'Build diagnostics for map viewport.',
                text: '```text\n' + log.slice(-50000) + '\n```' }
            });
